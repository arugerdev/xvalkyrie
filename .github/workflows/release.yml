name: release
on:
  push:
    tags: ["[0-9]*", "v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PORTABLE: XValkyrie-Win-x86_64-Portable.zip
      INSTALLER: XValkyrie-Win-x86_64.msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item build/Release/xvalkyrie.exe, build/Release/xvboot.exe, LICENSE, THIRD-PARTY.md, README.md stage
          # the Agility SDK's runtime, where xvboot looks for it
          New-Item -ItemType Directory stage/D3D12 | Out-Null
          Copy-Item build/Release/D3D12/D3D12Core.dll, build/Release/D3D12/LICENSE.txt stage/D3D12
          Compress-Archive -Path stage/* -DestinationPath $env:PORTABLE
      - name: Installer
        shell: pwsh
        run: |
          # Windows Installer versions are three numbers: v1.2.3-rc1 is 1.2.3
          $version = ($env:TAG -replace '^v', '') -replace '[-+].*$', ''
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/installer.wxs -arch x64 -d Version=$version -d Source=stage -o $env:INSTALLER
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made by hand for the tag gets the files; otherwise one is made
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:PORTABLE $env:INSTALLER --clobber
          } else {
            $title = "XValkyrie v" + ($env:TAG -replace '^v', '')
            gh release create $env:TAG $env:PORTABLE $env:INSTALLER --title $title --generate-notes --verify-tag
          }
